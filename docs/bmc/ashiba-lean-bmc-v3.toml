  業者A: 「30〜40%は寝てる、特に繁忙期外」
  業者B: 「20%くらい」
  業者C: 「40%超える時期がある (閑散期11〜2月)」
  業者D: 「25%程度、もっと稼ぎたい」
  業者E: 「季節によるが30〜50%」

パイロット推定遊休率: 約31% (中央値)
仮説方向: 正

供給側の主な懸念:
  1. 「知らない工務店からの注文が不安」(信頼問題)
  2. 「配送エリアが限られる」
  3. 「デジタル操作が苦手」
"""
signal     = "遊休率中央値 > 30%"
falsifier  = "遊休率 < 15% → 在庫活用ニーズなし → supply-side valueprop 再考"
