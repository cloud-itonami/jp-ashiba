パイロットインタビュー: 需要側 7社 (工務店 5社 + 塗装業者 2社)

Q2「見積依頼→業者決定」中央値: 4.2日 ✓ (仮説: 3日超)
  - 1日以内: 1社 (既存業者あり)
  - 2〜3日:  2社
  - 4〜7日:  3社 ← 大多数
  - 1週間超: 1社

Q5「一番イライラすること」TOP3:
  1位: 「断られること / 空きがない」 (6/7)
  2位: 「見積もりに時間がかかる」 (5/7)
  3位: 「業者の品質差が大きい」 (3/7)

初期シグナル: 仮説方向は正 (4.2日 > 3日閾値)
残タスク: 全20社完了で統計的有意差確認
"""
signal     = "Q2中央値 >= 3日 AND Q5で「探す手間」「断られる」が上位2位"
falsifier  = "Q2中央値 < 2日 → 調達速度は問題ではない → 別の痛点を優先"
interview_count_done   = 7
interview_count_target = 20

[[blocks.problem.entries]]
