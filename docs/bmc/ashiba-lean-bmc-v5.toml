scale_economics = """
スケール時 Unit Economics モデル (Year 1 末、GMV ¥50M/月):

収益:
  GMV: ¥50,000,000
  take rate 6%: ¥3,000,000/月

変動費 (COGS):
  人件費 per match (カスタマーサポート + 品質管理): ¥500/件 × 280件 = ¥140,000
  Stripe 手数料: 2.9% + ¥30 × 280件 = ¥1,460,000
  インフラ (Supabase + Vercel + Maps API): ¥150,000
  変動費合計: ¥1,750,000

Gross Profit: ¥3,000,000 - ¥1,750,000 = ¥1,250,000 (41.7% GM)

固定費:
  人件費 (チーム 5名): ¥2,500,000
  マーケ (Ads + SEO + リファラル): ¥700,000
  その他 (オフィス・ツール): ¥200,000
  固定費合計: ¥3,400,000

EBITDA: ¥1,250,000 - ¥3,400,000 = ▲¥2,150,000 (Month 6〜9 赤字)
Break-even GMV: ¥50M × (3,400,000 / 1,250,000) ÷ 0.417 ≈ GMV ¥122M/月

→ ¥122M/月 = 月 685件 @ 平均 ¥178K/件 = 約 23件/日

Series A 目標 (調達後 18ヶ月):
  GMV ¥200M/月 → EBITDA +¥10M/月 → 営業利益率 20%超
"""
